<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Bloquea el zoom accidental al pulsar botones rápido en Safari (iPad) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kirby GBA - iPad</title>
  <style>
    /* Ajusta el juego al 100% de la pantalla y evita el desplazamiento táctil */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Contenedor donde se dibuja el emulador -->
  <div id="game"></div>

  <script>
    // Contenedor HTML del reproductor
    window.EJS_player = "#game";

    // Núcleo de consola Game Boy Advance
    window.EJS_core = "gba";

    // Nombre visible del juego
    window.EJS_gameName = "Kirby and the Amazing Mirror";

    // Color de los botones e interfaz
    window.EJS_color = "#ff66b2";

    // Idioma de los menús
    window.EJS_language = "es-ES";

    // Ruta del archivo del juego en tu repositorio de GitHub
    window.EJS_gameUrl = "Kirby%20and%20the%20Amazing%20Mirror.gba";

    // Servidor alternativo (jsDelivr) muy rápido y compatible con redes escolares/iPad
    window.EJS_pathtodata = "https://jsdelivr.net";
  </script>

  <!-- Carga el motor principal del emulador -->
  <script src="https://jsdelivr.netloader.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kirby GBA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "gba";
    window.EJS_gameName = "Kirby and the Amazing Mirror";
    window.EJS_color = "#ff66b2";
    
    // Prevents iPad Chrome/WebKit black-screen crash
    window.EJS_threads = false;
    window.EJS_startOnLoaded = false;

    // Exact ROM filename in your GitHub repo
    window.EJS_gameUrl = "KirbyAmazingMirror.gba";
    
    // jsDelivr CDN (bypasses Google Sites & school network blocks)
    window.EJS_pathtodata = "https://jsdelivr.net";
  </script>
  <script src="https://jsdelivr.netloader.js"></script>
</body>
</html>

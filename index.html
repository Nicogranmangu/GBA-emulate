<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kirby GBA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      touch-action: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "gba";
    window.EJS_gameName = "Kirby";
    window.EJS_color = "#ff66b2";
    
    // Crucial for Chrome/Safari on iPad to prevent black screen crash
    window.EJS_threads = false;
    
    // Prevents auto-starting before user tap so the Play button stays visible
    window.EJS_startOnLoaded = false;

    window.EJS_gameUrl = "KirbyAmazingMirror.gba";
    window.EJS_pathtodata = "https://emulatorjs.org";
  </script>
  <script src="https://emulatorjs.orgloader.js"></script>
</body>
</html>
